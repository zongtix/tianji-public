server:
  port: 8084  #端口
  tomcat:
    uri-encoding: UTF-8   #服务编码
spring:
  config:
    import:
      - "nacos:shared-spring.yaml?group=DEFAULT_GROUP&refreshEnabled=false"
      - "nacos:shared-redis.yaml?group=DEFAULT_GROUP&refreshEnabled=false"
      - "nacos:shared-logs.yaml?group=DEFAULT_GROUP&refreshEnabled=false"
      - "nacos:shared-mybatis.yaml?group=DEFAULT_GROUP&refreshEnabled=false"
      - "nacos:shared-feign.yaml?group=DEFAULT_GROUP&refreshEnabled=false"
      - "nacos:${spring.application.name}.yaml?group=DEFAULT_GROUP&refreshEnabled=true"
      - "optional:nacos:${spring.application.name}-${spring.profiles.active}.yaml?group=DEFAULT_GROUP&refreshEnabled=true"
  profiles:
    active: dev
  application:
    name: media-service
  cloud:
    nacos:
      config:
        namespace: ${NACOS_NAMESPACE:tianji-local-boot3}
      discovery:
        namespace: ${NACOS_NAMESPACE}
tj:
  swagger:
    enable: true
    package-path: com.tianji.media.controller
    title: 天机学堂 - 媒资中心接口文档
    description: 该服务包含图片管理、媒资管理等
    contact-name: 传智教育·研究院
    contact-url: http://www.itcast.cn/
    contact-email: zhanghuyi@itcast.cn
    version: v1.0
    enableResponseWrap: true
  auth:
    resource:
      enable: true
      excludeLoginPaths:
        - /medias/signature/play
  jdbc:
    database: tj_media
  platform:
    file: TENCENT
    media: TENCENT
  tencent:
    appId: ${TJ_TENCENT_APP_ID:0}
    secretId: ${TJ_TENCENT_SECRET_ID:}
    secretKey: ${TJ_TENCENT_SECRET_KEY:}
    vod:
      enable: true
      vodValidSeconds: 7776000
      region: "ap-shanghai"
      procedure: "wisehub-base"
      urlKey: ${TJ_TENCENT_VOD_URL_KEY:}
      pfcg: "basicDrmPreset"
    cos:
      enable: true
      region: "ap-shanghai"
      bucket: ${TJ_TENCENT_COS_BUCKET:}
      multipartUploadThreshold: 5242880 # 5mb，触发分片上传的阈值
      minimumUploadPartSize: 1048576 # 1mb，分片的最小大小